name: Draw ZMK keymaps
# NOTE: auto-draw on push is disabled. This keymap is built on urob's
# zmk-helpers macros (ZMK_BASE_LAYER, ZMK_LAYER, ...), which keymap-drawer's
# preprocessor-only parser cannot expand, so the parse step fails. Run manually
# via workflow_dispatch only if/when a drawer pipeline that feeds the helper
# headers is set up. See README for status.
on:
  workflow_dispatch:

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      commit_message: "[Draw] ${{ github.event.head_commit.message }}"
      amend_commit: false
      install_branch: "main"
      keymap_patterns: "config/*.keymap"
      json_path: "config"
      config_path: "keymap_drawer.config.yaml" # config file, ignored if not exists
      output_folder: "keymap-drawer"
      destination: "both"
      parse_args: ""  # map of extra args to pass to `keymap parse`, e.g. "corne:'-l Def Lwr Rse' cradio:''"
      draw_args: ""   # map of extra args to pass to `keymap draw`, e.g. "corne:'-k corne_rotated' cradio:'-k paroxysm'"